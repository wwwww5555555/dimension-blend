name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支连续 push 时取消上一次，避免排队浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ubuntu-latest 自带 Android SDK（含 cmdline-tools），不必再用第三方 action 装一遍。
  # 2026-10-27 之前用 android-actions/setup-android@v3，它内部调 sdkmanager 时失败，
  # 而且失败点就在这一步 —— 后面的单测与 R8 构建根本没跑到。
  ANDROID_SDK_DIR: /usr/local/lib/android/sdk

jobs:
  build:
    name: 单测 + Release 构建
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 模型走 Git LFS（pct_net_vit.tflite 18.5MB）。单元测试与编译都**不读模型内容**，
          # 拿到 132 字节指针也不影响；如果要产出「可直接安装」的包，这里改成 true。
          # 这样每次 CI 省下 18.5MB 的 LFS 带宽（免费额度只有 1GB/月）。
          lfs: false
          fetch-depth: 1

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（用 runner 预装 SDK，可自愈）
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$ANDROID_SDK_DIR}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::找不到 Android SDK（ANDROID_HOME=${ANDROID_HOME:-<unset>}，回退 $ANDROID_SDK_DIR）"
            exit 1
          fi

          # 找 sdkmanager：优先版本号最大的，全都找不到就自己下一份 cmdline-tools
          SDKM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -r | head -1 || true)"
          if [ -z "${SDKM:-}" ]; then
            echo "预装 SDK 里没有 cmdline-tools，改为自行下载"
            curl -sSL --retry 3 -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p "$SDK/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          chmod +x "$SDKM"

          echo "ANDROID_HOME=$SDK"
          echo "sdkmanager=$SDKM"
          "$SDKM" --version

          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"
          dirname "$SDKM" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: 安装 SDK 组件（compileSdk 35 / build-tools 34）
        # 不再把输出丢进 /dev/null —— 上一次失败的真实原因就是被它吞掉的。
        # `yes | ... || true` 只兜 license 交互的退出码，安装失败仍会中断。
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_DIR}"
          yes | sdkmanager --sdk_root="$SDK" --licenses > /tmp/licenses.log 2>&1 || true
          sdkmanager --sdk_root="$SDK" --install "platforms;android-35" "build-tools;34.0.0"

          echo "--- 安装结果 ---"
          ls -1 "$SDK/platforms"
          ls -1 "$SDK/build-tools"
          test -d "$SDK/platforms/android-35"     || { echo "::error::platforms/android-35 缺失"; exit 1; }
          test -d "$SDK/build-tools/34.0.0"       || { echo "::error::build-tools/34.0.0 缺失"; exit 1; }

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      # Windows 上创建的仓库可能丢执行位，这行是兜底（正常情况下 git 已记录 100755）
      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      - name: 单元测试（423 个用例 / 60 个测试类）
        run: ./gradlew testDebugUnitTest --stacktrace

      # 这一步同时验证三件容易悄悄坏掉的事：
      #  ① release 变体能编译（debug-only 引用不会漏进来）
      #  ② R8 规则没把反射/JNI 类裁掉（上次 GpuDelegate 缺类就是在这里炸的）
      #  ③ 资源裁剪没有裁到运行时用到的资源
      - name: Release 构建（R8 + 资源裁剪校验）
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 失败时上传报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            app/build/outputs/mapping/release/**
            /tmp/licenses.log
          retention-days: 7
