name: CI

on:
  push:
    branches: [ main ]
    # 打 v* tag 时额外产出可分发的安装包并建 Release（见文件末尾 release job）
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支连续 push 时取消上一次，避免排队浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ubuntu-latest 自 2026-10-19 起在滚动迁移到 Ubuntu 26.04（预计 11-19 完成），
  # 期间同一个 label 会随机落到 24.04 或 26.04，Android SDK 布局/系统库都可能不同。
  # CI 要可复现，所以固定到 24.04；要换镜像请手动改这一行，不要让 label 决定。
  ANDROID_SDK_DIR: /usr/local/lib/android/sdk

jobs:
  build:
    name: 单测 + Release 构建
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 模型走 Git LFS（pct_net_vit.tflite 18.5MB）：
          #  · 普通分支/PR：lfs: false —— 单测与编译都不读模型内容，拿到 132 字节指针也无所谓，
          #    每次省 18.5MB LFS 带宽（免费额度 1GB/月）。
          #  · tag 发布：必须拉真模型，否则打出来的 APK 里是 LFS 指针，装上去和谐化直接失效。
          lfs: ${{ startsWith(github.ref, 'refs/tags/v') }}
          fetch-depth: 1

      - name: 解析版本号（仅 tag 构建）
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            echo "VERSION_NAME=$V"     >> "$GITHUB_ENV"
            # versionCode 用 run_number（单调递增），否则手机无法覆盖安装
            echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "发布版本：$V (code=${GITHUB_RUN_NUMBER})"
          else
            echo "非 tag 构建，使用仓库内默认版本号"
          fi

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 失败时把真实原因写成「注解」：这样不用登录也能在
      # GET /repos/{owner}/{repo}/check-runs/{id}/annotations 里读到。
      # 之前 4 次失败只留下 "Process completed with exit code 1"，什么都查不到。
      - name: 准备 Android SDK
        run: |
          LOG=/tmp/sdk-setup.log
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$ANDROID_SDK_DIR}}"

          fail() {
            rc=$1; shift
            echo "::error::Android SDK 步骤失败（exit $rc）：$*  [SDK=$SDK]"
            tail -12 "$LOG" 2>/dev/null | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error::$l"
            done
            exit "$rc"
          }

          [ -d "$SDK" ] || fail 1 "SDK 目录不存在（ANDROID_HOME=${ANDROID_HOME:-<unset>}，回退 $ANDROID_SDK_DIR）"

          # 找 sdkmanager：优先版本号最大的。
          # ⚠️ 这里**绝不能**无条件 chmod：/usr/local/lib/android/sdk 属于 root，
          #    runner 用户没有写权限，chmod 会 "Operation not permitted" 直接失败
          #    （d8d9b79 就是这么挂的）。镜像里的文件本来就带可执行位，只校验不修改。
          SDKM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -r | head -1 || true)"
          if [ -n "${SDKM:-}" ] && [ ! -x "$SDKM" ]; then
            echo "$SDKM 不可执行，改用镜像里的其它版本或自行下载"
            SDKM=""
          fi

          if [ -z "${SDKM:-}" ]; then
            # 镜像里没有可用 cmdline-tools：装到 runner 可写的目录，不动系统目录
            SDK="${RUNNER_TEMP:-/tmp}/android-sdk"
            echo "改用自己的 SDK 根目录：$SDK" | tee -a "$LOG"
            curl -sSL --retry 3 -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              >>"$LOG" 2>&1 || fail 1 "下载 cmdline-tools 失败"
            rm -rf /tmp/clt && unzip -q /tmp/cmdline-tools.zip -d /tmp/clt >>"$LOG" 2>&1 || fail 1 "解压 cmdline-tools 失败"
            mkdir -p "$SDK/cmdline-tools" >>"$LOG" 2>&1 || fail 1 "无法创建 $SDK/cmdline-tools"
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest" >>"$LOG" 2>&1 || fail 1 "移动 cmdline-tools 失败"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKM" >>"$LOG" 2>&1 || fail 1 "chmod 失败（$SDK 是自己的目录，本应可写）"
          fi

          echo "SDK=$SDK"
          echo "sdkmanager=$SDKM"
          [ -x "$SDKM" ] || fail 1 "sdkmanager 不可执行：$SDKM"
          "$SDKM" --version >>"$LOG" 2>&1 || fail 1 "sdkmanager --version 执行失败（$SDKM）"
          tail -3 "$LOG" 2>/dev/null || true

          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"
          dirname "$SDKM" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: 安装 SDK 组件（compileSdk 35 / build-tools 34）
        # 不再把输出丢进 /dev/null —— 最早那次失败的真实原因就是被它吞掉的。
        # `yes | ... || true` 只兜 license 交互的退出码，装包失败仍会中断并打注解。
        run: |
          LOG=/tmp/sdk-install.log
          SDK="${ANDROID_HOME:-$ANDROID_SDK_DIR}"

          fail() {
            rc=$1; shift
            echo "::error::SDK 组件安装失败（exit $rc）：$*"
            tail -15 "$LOG" 2>/dev/null | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error::$l"
            done
            exit "$rc"
          }

          yes | sdkmanager --sdk_root="$SDK" --licenses > "$LOG" 2>&1 || true
          sdkmanager --sdk_root="$SDK" --install "platforms;android-35" "build-tools;34.0.0" 2>&1 | tee -a "$LOG" \
            || fail 1 "sdkmanager --install"

          echo "--- 安装结果 ---"
          ls -1 "$SDK/platforms"    2>&1 | tee -a "$LOG" || true
          ls -1 "$SDK/build-tools"  2>&1 | tee -a "$LOG" || true
          [ -d "$SDK/platforms/android-35" ] || fail 1 "platforms/android-35 缺失"
          [ -d "$SDK/build-tools/34.0.0"  ] || fail 1 "build-tools/34.0.0 缺失"

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      # Windows 上创建的仓库可能丢执行位，这行是兜底（正常情况下 git 已记录 100755）
      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      # 有签名 secrets 就写进 local.properties（app/build.gradle.kts 从这 4 个键读签名）；
      # 没有就跳过 —— 仍然产出 unsigned 包用于验证 R8，只是不能安装、也不会发布。
      - name: 配置 release 签名（可选）
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KS_KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "${KS_B64:-}" ]; then
            echo "::warning::未配置 RELEASE_KEYSTORE_BASE64，本次产出 unsigned 包（无法安装、不可发布）"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_PASSWORD=$KS_PW"
            echo "RELEASE_KEY_ALIAS=$KS_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KS_KEY_PW"
          } >> local.properties
          echo "已注入签名配置（alias=$KS_ALIAS）"

      - name: 单元测试（423 个用例 / 60 个测试类）
        # 失败时把 Gradle 的 FAILURE 段写成注解，便于在 check-run 注解里直接看到原因
        run: |
          LOG=/tmp/test.log
          ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::单测失败（exit $rc）"
            grep -E "FAILED|tests completed|AssertionError|Exception|Caused by" "$LOG" | head -20 | while IFS= read -r l; do
              echo "::error::$l"
            done
            exit "$rc"
          fi

      # 这一步同时验证三件容易悄悄坏掉的事：
      #  ① release 变体能编译（debug-only 引用不会漏进来）
      #  ② R8 规则没把反射/JNI 类裁掉（上次 GpuDelegate 缺类就是在这里炸的）
      #  ③ 资源裁剪没有裁到运行时用到的资源
      - name: Release 构建（R8 + 资源裁剪校验）
        run: |
          LOG=/tmp/release.log
          ./gradlew :app:assembleRelease --stacktrace --console=plain 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::Release 构建失败（exit $rc）"
            grep -E "FAILURE|error:|Missing class|R8:|Caused by|Execution failed" "$LOG" | head -20 | while IFS= read -r l; do
              echo "::error::$l"
            done
            exit "$rc"
          fi

      # tag 构建才做这些：产出必须是「能直接装」的包，否则宁可红着也别发出去
      - name: 校验安装包（签名 / 权限 / 模型不是 LFS 指针）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          echo "APK=$APK"
          case "$APK" in
            *unsigned*)
              echo "::error::产物是 unsigned 包，手机无法安装。请在仓库 Settings → Secrets 配置签名变量（见 docs/RELEASE.md）"
              exit 1 ;;
          esac

          BT="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_DIR}"/build-tools/* | sort -V | tail -1)"
          echo "--- 签名 ---"
          "$BT/apksigner" verify --print-certs "$APK" | head -6
          echo "--- 权限（必须无 INTERNET / CAMERA）---"
          PERMS="$("$BT/aapt2" dump permissions "$APK")"
          echo "$PERMS"
          if echo "$PERMS" | grep -qE "INTERNET|CAMERA"; then
            echo "::error::APK 里出现了 INTERNET 或 CAMERA 权限"
            exit 1
          fi

          # 模型必须是真文件（约 19MB），否则说明 checkout 没拉 LFS
          SIZE="$(unzip -l "$APK" | awk '/pct_net_vit.tflite/{print $1; exit}')"
          echo "pct_net_vit.tflite = ${SIZE:-0} bytes"
          [ "${SIZE:-0}" -gt 1000000 ] || { echo "::error::模型是 LFS 指针（${SIZE:-0} 字节），不能发布"; exit 1; }

          ls -la app/build/outputs/apk/release/

      - name: 上传安装包产物
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 失败时上传报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            app/build/outputs/mapping/release/**
            /tmp/sdk-setup.log
            /tmp/sdk-install.log
            /tmp/test.log
            /tmp/release.log
          retention-days: 7

  # 只在打 tag 时运行：把 build 产出的安装包挂到 GitHub Release。
  # 别人打开仓库页面 → 右侧 Releases → 点进去就能直接下载 APK。
  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # gh release create 需要写权限
    steps:
      - name: 下载安装包产物
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: out

      - name: 重命名并生成校验和
        run: |
          set -euo pipefail
          APK="$(ls out/*.apk | head -1)"
          NAME="DimensionBlend-${GITHUB_REF_NAME}.apk"
          cp "$APK" "out/$NAME"
          ( cd out && sha256sum "$NAME" > "$NAME.sha256" && cat "$NAME.sha256" )
          ls -la out

      - name: 创建 Release 并挂上安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAME="DimensionBlend-${GITHUB_REF_NAME}.apk"

          cat > /tmp/notes.md <<'NOTES'
          ## 下载安装

          点下方的 `DimensionBlend-@TAG@.apk` 即可下载。

          - 系统要求：**Android 8.0（API 26）及以上**，arm64-v8a / armeabi-v7a
          - 首次安装需在系统设置里允许「安装未知应用」
          - **不联网**：应用清单里没有 `INTERNET` 权限，系统层面就没有上传图片的能力；飞行模式下可用
          - 全部计算（光照估计、抠图、融合）都在本机完成，没有私有服务器

          ## 校验完整性

          ```bash
          sha256sum -c DimensionBlend-@TAG@.apk.sha256
          ```

          ## 说明

          代码以 Apache-2.0 发布；内置的 PCT-Net 预训练权重为 MPL-2.0（允许商业使用）。
          详见仓库里的 `LICENSE`、`NOTICE`、`THIRD-PARTY-LICENSES.md`。
          NOTES

          sed -i "s/@TAG@/${GITHUB_REF_NAME}/g" /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" "out/$NAME" "out/$NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "次元溶图 ${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md
